<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>emojisinvade – Play & Listen</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" tabindex="0"></canvas>
    <div id="overlay">PAUSED</div>
    <div id="gameOverOverlay">💀 GAME OVER 💀</div>
  </div>

  <div id="statusBarCombined">
    <span id="scoreDisplay">Score: 0</span>
    <span id="highScoreDisplay">High Score: 0</span>
    <span id="livesDisplay"></span>
    <button id="pauseBtn">⏸️</button>
    <button id="muteBtn">🔊</button>
    <label for="speedSelect" class="visually-hidden">Game Speed</label>
    <select id="speedSelect">
      <option value="40">Normal</option>
      <option value="20">Fast</option>
      <option value="10">Turbo</option>
    </select>
    <button id="toggleRadio">Radio OFF</button>
    <button id="loginBtn">LOG IN</button>
  </div>

  <div id="loginPopup">
    <span id="closeLoginPopup">&times;</span>
    <p>Select WAX Wallet</p>
    <button onclick="alert('Login with Anchor')">Anchor</button>
    <button onclick="alert('Login with MyCloud')">MyCloud</button>
    <button onclick="alert('Login with Wombat')">Wombat</button>
  </div>

  <!-- Touch Controls Overlay: dynamically shown/hidden via CSS for mobile/tablet -->
  <div id="touch-controls" style="display: none;">
    <!-- Fire Button (Left) -->
    <div class="touch-btn fire">
      🔥 FIRE
    </div>
    <!-- Move Area (Right) -->
    <div class="touch-btn move">
      <span style="flex:1;text-align:center;font-size:2em;color:#fff;">←</span>
      <span style="flex:1;text-align:center;font-size:2em;color:#fff;">→</span>
    </div>
  </div>

  <audio id="radioStream" loop>
    <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
  </audio>
  <script src="game.js"></script>
</body>
</html>
