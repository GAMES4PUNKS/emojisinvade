<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>emojisinvade – Play & Listen</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('bgobe.jpg') center center fixed;
      background-size: cover;
      font-family: 'Orbitron', "Segoe UI", sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      background: url('moshed-2021-11-29-0-39-58.gif') center/cover no-repeat;
      box-shadow: 0 0 20px #a020f0;
      margin-top: 1rem;
    }
    #statusBarCombined {
      display: flex;
      font-size: 1rem;
      color: white;
      margin-top: 0.5rem;
      justify-content: center;
      align-items: center;
      gap: 0.7em;
      flex-wrap: wrap;
    }
    #statusBarCombined span,
    #statusBarCombined button,
    #statusBarCombined select {
      font-family: 'Orbitron', "Segoe UI", sans-serif;
    }
    #statusBarCombined button,
    #statusBarCombined select {
      background: none;
      color: white;
      border: 1px solid #a020f0;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 2rem 3rem;
      border-radius: 1rem;
      display: none;
      z-index: 5;
    }
    #gameOverOverlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      font-size: 2rem;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #loginPopup {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.95);
      border: 1px solid #888;
      padding: 1rem;
      border-radius: 10px;
      z-index: 20;
      color: white;
      min-width: 250px;
      text-align: center;
    }
    #loginPopup button {
      margin: 0.5rem;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }
    #closeLoginPopup {
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 20px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="overlay">PAUSED</div>
  <div id="gameOverOverlay">GAME OVER</div>
  <div id="statusBarCombined">
    <span id="scoreDisplay">Score: 0</span>
    <span id="highScoreDisplay">High Score: 0</span>
    <button id="pauseBtn">⏸️</button>
    <button id="muteBtn">🔊</button>
    <label for="speedSelect" class="visually-hidden">Game Speed</label>
    <select id="speedSelect">
      <option value="250">Normal</option>
      <option value="120">Fast</option>
      <option value="60">Turbo</option>
    </select>
    <button id="toggleRadio">Radio OFF</button>
    <button id="loginBtn">LOG IN</button>
  </div>
  <div id="loginPopup">
    <span id="closeLoginPopup">&times;</span>
    <p>Select WAX Wallet</p>
    <button onclick="alert('Login with Anchor')">Anchor</button>
    <button onclick="alert('Login with MyCloud')">MyCloud</button>
    <button onclick="alert('Login with Wombat')">Wombat</button>
  </div>
  <audio id="radioStream" loop>
    <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
  </audio>
  <script src="game.js"></script>
</body>
</html>
