<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emoji Invaders</title>
  <meta name="viewport" content="width=420, initial-scale=1.0">
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
    }
    #hud {
      width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 0 0;
      font-size: 18px;
    }
    #gameCanvas {
      background: #18181a;
      border: 3px solid #444;
      display: block;
      margin: 14px 0 0 0;
      image-rendering: pixelated;
      box-shadow: 0 4px 24px #000a;
    }
    #overlay, #gameOverOverlay {
      position: absolute;
      left: 0; right: 0;
      top: 0; bottom: 0;
      width: 400px;
      height: 400px;
      margin: auto;
      display: none;
      z-index: 10;
      align-items: center;
      justify-content: center;
      background: rgba(24,24,26,0.85);
      color: #fff;
      text-align: center;
      font-size: 2em;
      font-weight: bold;
      border-radius: 6px;
      flex-direction: column;
    }
    #gameOverOverlay h2 {
      margin: 0 0 8px 0;
      font-size: 2.1em;
      color: #ff8080;
    }
    #scoreDisplay, #highScoreDisplay {
      padding: 0 8px;
    }
    @media (max-width: 420px) {
      body, #hud {
        width: 100vw !important;
      }
      #gameCanvas, #overlay, #gameOverOverlay {
        width: 100vw !important;
        height: 100vw !important;
        max-width: 100vw !important;
        max-height: 100vw !important;
        min-width: unset;
        min-height: unset;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="scoreDisplay">Score: 0</div>
    <div id="highScoreDisplay">High Score: 0</div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="overlay"></div>
  <div id="gameOverOverlay"></div>
  <script src="game.js"></script>
</body>
</html>
